# docker-compose.dev.yml — developer mode
# Dev mode (opt-in): docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# What it adds:
#   - bind mount of the source code (changes in code are visible without rebuilding)
#   - NODE_ENV=development
#   - exposed ports of the services on the host (easier access from Postman/curl)

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"   # integration tests connect to localhost:5432
  catalog-service:
    environment:
      - NODE_ENV=development
    volumes:
      - ./apps/catalog-service/src:/app/src:ro   # bind mount — live code
    ports:
      - "3001:3001"

  review-service:
    environment:
      - NODE_ENV=development
    volumes:
      - ./apps/review-service/src:/app/src:ro
    ports:
      - "3002:3002"

  order-service:
    environment:
      - NODE_ENV=development
    volumes:
      - ./apps/order-service/src:/app/src:ro
    ports:
      - "3003:3003"

  gateway:
    environment:
      - NODE_ENV=development
    volumes:
      - ./apps/gateway/src:/app/src:ro
    ports:
      - "3000:3000"
    command: npm run dev
