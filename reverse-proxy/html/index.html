<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GrailKits</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
    button { cursor: pointer; padding: 8px 16px; margin: 4px; border-radius: 4px; border: 1px solid #ccc; }
    button.primary { background: #1a1a1a; color: white; border-color: #1a1a1a; }
    button.danger  { background: #c0392b; color: white; border-color: #c0392b; }
    pre  { background: #f4f4f4; padding: 12px; border-radius: 4px; overflow: auto; font-size: 13px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; margin-left: 8px; }
    .badge.admin { background: #e74c3c; color: white; }
    .badge.user  { background: #2ecc71; color: white; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 12px; margin-bottom: 24px; }
    h1 { margin: 0; }
    section { margin-bottom: 32px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Config
    const KC    = '/auth/realms/grailkits/protocol/openid-connect';
    const CID   = 'grailkits-frontend';
    const REDIR = `${window.location.origin}/callback`;
    const API   = '/api/v1';

    // PKCE helpers
    const genVerifier = () => {
      const arr = new Uint8Array(64);
      crypto.getRandomValues(arr);
      return btoa(String.fromCharCode(...arr))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
    };

    const genChallenge = async (verifier) => {
      const data   = new TextEncoder().encode(verifier);
      const digest = await crypto.subtle.digest('SHA-256', data);
      return btoa(String.fromCharCode(...new Uint8Array(digest)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
    };

    const decodeJwt = (token) => {
      try { return JSON.parse(atob(token.split('.')[1])); }
      catch { return {}; }
    };

    // Callback component
    function Callback({ onToken }) {
      const [status, setStatus] = useState('Exchanging code for token...');

      useEffect(() => {
        const code     = new URLSearchParams(window.location.search).get('code');
        const verifier = sessionStorage.getItem('pkce_verifier');
        if (!code || !verifier) { setStatus('Error: missing code or verifier'); return; }

        fetch(`${KC}/token`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            grant_type:    'authorization_code',
            client_id:      CID,
            redirect_uri:   REDIR,
            code,
            code_verifier:  verifier,
          }),
        })
          .then(r => r.json())
          .then(data => {
            if (data.access_token) {
              sessionStorage.removeItem('pkce_verifier');
              onToken(data.access_token);
            } else {
              setStatus(`Error: ${JSON.stringify(data)}`);
            }
          })
          .catch(e => setStatus(`Fetch error: ${e.message}`));
      }, []);

      return <p>{status}</p>;
    }

    // ProductList — public
    function ProductList() {
      const [products, setProducts] = useState([]);
      const [loading,  setLoading]  = useState(true);
      const [error,    setError]    = useState(null);

      useEffect(() => {
        fetch(`${API}/products`)
          .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
          .then(data => { setProducts(Array.isArray(data) ? data : []); setLoading(false); })
          .catch(e  => { setError(e.message); setLoading(false); });
      }, []);

      return (
        <section>
          <h2>Products</h2>
          {loading && <p>Loading…</p>}
          {error   && <p style={{color:'red'}}>Error: {error}</p>}
          {!loading && !error && products.length === 0 && <p>No products found.</p>}
          <ul style={{listStyle:'none', padding:0}}>
            {products.map(p => (
              <li key={p.id} style={{borderBottom:'1px solid #eee', padding:'8px 0'}}>
                <strong>{p.name}</strong> — <em>{p.brand}</em>
                {Array.isArray(p.variants) && p.variants.map(v => (
                  <span key={v.id} style={{marginLeft:12, fontSize:13, color:'#555'}}>
                    [{v.size}] {(v.price / 100).toFixed(2)} PLN · stock: {v.stock}
                    &nbsp;<code style={{fontSize:11,color:'#888'}}>{v.id}</code>
                  </span>
                ))}
              </li>
            ))}
          </ul>
        </section>
      );
    }

    // CartPanel — requires auth
    function CartPanel({ token }) {
      const user   = decodeJwt(token);
      const userId = user.preferred_username || user.sub;

      const [cart,      setCart]      = useState(null);
      const [variantId, setVariantId] = useState('');
      const [qty,       setQty]       = useState(1);
      const [msg,       setMsg]       = useState('');

      const authHeaders = {
        'Authorization': `Bearer ${token}`,
        'x-user-id':     userId,
      };

      const fetchCart = () =>
        fetch(`${API}/cart`, { headers: authHeaders })
          .then(r => r.json())
          .then(setCart)
          .catch(e => setMsg(`Cart fetch error: ${e.message}`));

      useEffect(() => { fetchCart(); }, []);

      const addLine = async () => {
        if (!variantId.trim()) return setMsg('Paste a Variant ID from the product list above.');
        const res = await fetch(`${API}/cart/lines`, {
          method: 'POST',
          headers: { ...authHeaders, 'Content-Type': 'application/json' },
          body: JSON.stringify({ variantId: variantId.trim(), quantity: Number(qty) }),
        });
        const data = await res.json();
        if (!res.ok) return setMsg(`Error: ${data.error || res.status}`);
        setMsg('Added to cart!');
        fetchCart();
      };

      const checkout = async () => {
        const res = await fetch(`${API}/checkout`, {
          method: 'POST',
          headers: { ...authHeaders, 'Content-Type': 'application/json' },
        });
        const data = await res.json();
        if (!res.ok) return setMsg(`Checkout error: ${data.error || res.status}`);
        setMsg(`Order placed! ID: ${data.id} · Status: ${data.status}`);
        fetchCart();
      };

      return (
        <section>
          <h2>Cart</h2>
          <div style={{display:'flex', gap:8, flexWrap:'wrap', marginBottom:8}}>
            <input
              value={variantId}
              onChange={e => setVariantId(e.target.value)}
              placeholder="Variant ID (copy from product list)"
              style={{flex:1, minWidth:260, padding:'6px 10px', borderRadius:4, border:'1px solid #ccc'}}
            />
            <input
              type="number" min="1" value={qty}
              onChange={e => setQty(e.target.value)}
              style={{width:64, padding:'6px 10px', borderRadius:4, border:'1px solid #ccc'}}
            />
            <button className="primary" onClick={addLine}>Add to cart</button>
          </div>
          {msg && <p style={{margin:'4px 0'}}><em>{msg}</em></p>}
          {cart?.lines?.length > 0 && (
            <>
              <table style={{width:'100%', borderCollapse:'collapse', marginTop:8}}>
                <thead>
                  <tr style={{textAlign:'left', borderBottom:'2px solid #eee'}}>
                    <th>Variant ID</th><th style={{textAlign:'right'}}>Qty</th>
                  </tr>
                </thead>
                <tbody>
                  {cart.lines.map(l => (
                    <tr key={l.id} style={{borderBottom:'1px solid #f0f0f0'}}>
                      <td style={{fontSize:12, color:'#666'}}>{l.variantId}</td>
                      <td style={{textAlign:'right'}}>{l.quantity}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              {cart.status === 'OPEN' && (
                <button className="primary" style={{marginTop:12}} onClick={checkout}>Checkout</button>
              )}
            </>
          )}
          {cart && cart.lines?.length === 0 && <p style={{color:'#888'}}>Cart is empty.</p>}
        </section>
      );
    }

    // AdminPanel — requires admin role
    function AdminPanel({ token }) {
      const [reviews, setReviews] = useState([]);
      const [loading, setLoading] = useState(true);
      const [msg,     setMsg]     = useState('');

      const fetchPending = () => {
        fetch(`${API}/reviews?status=PENDING`, {
          headers: { 'Authorization': `Bearer ${token}` },
        })
          .then(r => r.json())
          .then(data => { setReviews(Array.isArray(data) ? data : []); setLoading(false); })
          .catch(e => { setMsg(`Fetch error: ${e.message}`); setLoading(false); });
      };

      useEffect(() => { fetchPending(); }, []);

      const moderate = async (id, status) => {
        const res = await fetch(`${API}/reviews/${id}/moderate`, {
          method: 'PATCH',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ status, moderatorId: decodeJwt(token).sub, reason: `Manually ${status.toLowerCase()}` }),
        });
        const data = await res.json();
        if (!res.ok) return setMsg(`Error: ${data.error || res.status}`);
        setMsg(`Review ${id.slice(0,8)}… → ${status}`);
        fetchPending();
      };

      return (
        <section>
          <h2>Admin — Review Moderation</h2>
          {msg && <p style={{margin:'4px 0'}}><em>{msg}</em></p>}
          {loading && <p>Loading reviews…</p>}
          {!loading && reviews.length === 0 && <p style={{color:'#888'}}>No pending reviews.</p>}
          {reviews.map(r => (
            <div key={r._id} style={{border:'1px solid #ddd', borderRadius:6, padding:14, marginBottom:10}}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start'}}>
                <div>
                  <strong>{r.title}</strong>
                  <span style={{marginLeft:8, color:'#f39c12'}}>{'★'.repeat(r.rating)}{'☆'.repeat(5 - r.rating)}</span>
                  <span style={{marginLeft:8, fontSize:12, color:'#888'}}>{r.status}</span>
                </div>
                <div>
                  <button className="primary" onClick={() => moderate(r._id, 'APPROVED')}>Approve</button>
                  <button className="danger"  onClick={() => moderate(r._id, 'REJECTED')}>Reject</button>
                </div>
              </div>
              <p style={{margin:'6px 0 0', fontSize:14, color:'#444'}}>{r.body}</p>
            </div>
          ))}
        </section>
      );
    }

    // App
    function App() {
      const [token, setToken] = useState(sessionStorage.getItem('token'));
      const [user,  setUser]  = useState(() => {
        const t = sessionStorage.getItem('token');
        return t ? decodeJwt(t) : null;
      });

      const roles   = user?.realm_access?.roles || [];
      const isAdmin = roles.includes('admin');

      const login = async () => {
        const verifier  = genVerifier();
        const challenge = await genChallenge(verifier);
        sessionStorage.setItem('pkce_verifier', verifier);
        const params = new URLSearchParams({
          response_type:         'code',
          client_id:              CID,
          redirect_uri:           REDIR,
          scope:                  'openid profile',
          code_challenge:         challenge,
          code_challenge_method:  'S256',
        });
        window.location.href = `${KC}/auth?${params}`;
      };

      const logout = () => {
        sessionStorage.removeItem('token');
        setToken(null);
        setUser(null);
      };

      const saveToken = (t) => {
        sessionStorage.setItem('token', t);
        setToken(t);
        setUser(decodeJwt(t));
        window.history.replaceState({}, '', '/');
      };

      if (window.location.pathname === '/callback') {
        return <Callback onToken={saveToken} />;
      }

      return (
        <>
          <header>
            <h1>GrailKits</h1>
            <div>
              {user
                ? <>
                    <strong>{user.preferred_username}</strong>
                    <span className={`badge ${isAdmin ? 'admin' : 'user'}`}>
                      {isAdmin ? 'admin' : 'user'}
                    </span>
                    <button className="danger" onClick={logout}>Logout</button>
                  </>
                : <button className="primary" onClick={login}>Login</button>
              }
            </div>
          </header>

          <ProductList />
          {token && <CartPanel token={token} />}
          {token && isAdmin && <AdminPanel token={token} />}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
